name: Update Dashboard Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # 台灣時間每天上午 7:00 左右執行

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4

      - name: Fetch GitHub Project data
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "Ayla-git") {
                projectV2(number: 1) {
                  title

                  items(first: 100) {
                    nodes {
                      type

                      content {
                        ... on Issue {
                          title
                          number
                          state

                          repository {
                            name
                          }

                          parent {
                            title
                            number
                            repository {
                              name
                            }
                          }

                          subIssuesSummary {
                            total
                            completed
                            percentCompleted
                          }
                        }

                        ... on DraftIssue {
                          title
                        }
                      }

                      fieldValues(first: 40) {
                        nodes {

                          ... on ProjectV2ItemFieldTextValue {
                            text
                            field {
                              ... on ProjectV2FieldCommon {
                                name
                              }
                            }
                          }

                          ... on ProjectV2ItemFieldNumberValue {
                            number
                            field {
                              ... on ProjectV2FieldCommon {
                                name
                              }
                            }
                          }

                          ... on ProjectV2ItemFieldDateValue {
                            date
                            field {
                              ... on ProjectV2FieldCommon {
                                name
                              }
                            }
                          }

                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            field {
                              ... on ProjectV2SingleSelectField {
                                name
                              }
                            }
                          }

                          ... on ProjectV2ItemFieldMultiSelectValue {
                            value
                            field {
                              ... on ProjectV2MultiSelectField {
                                name
                              }
                            }
                          }

                          ... on ProjectV2ItemFieldIterationValue {
                            title
                            field {
                              ... on ProjectV2IterationField {
                                name
                              }
                            }
                          }

                        }
                      }
                    }
                  }
                }
              }
            }
          ' > project_raw.json

      - name: Build public dashboard data
        run: |
          python <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          with open("project_raw.json", "r", encoding="utf-8") as f:
              raw = json.load(f)

          project = raw["data"]["user"]["projectV2"]
          items = []

          for node in project["items"]["nodes"]:
              content = node.get("content") or {}

              title = content.get("title", "")
              if not title:
                  continue

              fields = {}

              for fv in node.get("fieldValues", {}).get("nodes", []):
                  if not fv:
                      continue

                  field = fv.get("field") or {}
                  field_name = field.get("name")

                  if not field_name:
                      continue

                  if "text" in fv:
                      fields[field_name] = fv["text"]

                  elif "number" in fv:
                      fields[field_name] = fv["number"]

                  elif "date" in fv:
                      fields[field_name] = fv["date"]

                  elif "value" in fv:
                      # Multi select
                      raw_value = fv.get("value") or ""

                      fields[field_name] = [
                          x.strip()
                          for x in raw_value.split(",")
                          if x.strip()
                      ]

                  elif "name" in fv:
                      fields[field_name] = fv["name"]

                  elif "title" in fv:
                      fields[field_name] = fv["title"]


              # -------------------------
              # Parent issue
              # -------------------------

              parent = content.get("parent") or {}

              parent_title = parent.get("title")
              parent_number = parent.get("number")

              parent_repo = (
                  (parent.get("repository") or {}).get("name")
                  if parent
                  else None
              )


              # -------------------------
              # Sub-issue progress
              # -------------------------

              summary = content.get("subIssuesSummary") or {}

              sub_total = summary.get("total", 0)
              sub_completed = summary.get("completed", 0)
              progress = summary.get("percentCompleted", 0)


              # -------------------------
              # Repository
              # -------------------------

              repository = (
                  (content.get("repository") or {}).get("name")
                  if content
                  else None
              )


              # -------------------------
              # 執行單位
              # -------------------------

              executing_units = fields.get("執行單位")

              if isinstance(executing_units, str):
                  executing_units = [
                      x.strip()
                      for x in executing_units.split(",")
                      if x.strip()
                  ]

              if not isinstance(executing_units, list):
                  executing_units = []


              item = {

                  # ---------------------
                  # 基本資料
                  # ---------------------

                  "title": title,
                  "number": content.get("number"),
                  "repository": repository,

                  # ---------------------
                  # 父子階層
                  # ---------------------

                  "parent": parent_title,
                  "parentNumber": parent_number,
                  "parentRepository": parent_repo,

                  # ---------------------
                  # 子任務進度
                  # ---------------------

                  "subIssuesTotal": sub_total,
                  "subIssuesCompleted": sub_completed,
                  "progress": progress,

                  # ---------------------
                  # 工作管理
                  # ---------------------

                  "status": fields.get("Status"),
                  "phase": fields.get("Phase"),
                  "itemType": fields.get("Item Type"),
                  "executingUnits": executing_units,

                  # ---------------------
                  # 時程
                  # ---------------------

                  "plannedStart":
                      fields.get("預計開始")
                      or fields.get("起始"),

                  "plannedEnd":
                      fields.get("預計結束")
                      or fields.get("結束"),

                  "actualStart":
                      fields.get("實際開始"),

                  "actualEnd":
                      fields.get("實際完成")
                      or fields.get("實際結束"),

                  "scheduleStatus":
                      fields.get("時程狀態"),

                  # ---------------------
                  # 主管／月報
                  # ---------------------

                  "monthlyCategory":
                      fields.get("月報分類"),

                  "keyMilestone":
                      fields.get("關鍵節點"),

                  # ---------------------
                  # WBS
                  # ---------------------

                  "wbs":
                      fields.get("WBS排序"),
              }

              items.append(item)


          # -----------------------------
          # WBS 排序
          # -----------------------------

          def sort_key(item):

              wbs = item.get("wbs")

              try:
                  return float(wbs)
              except:
                  return 999999999


          items.sort(key=sort_key)


          # -----------------------------
          # 輸出公開 Dashboard 資料
          # -----------------------------

          output = {
              "projectTitle": project["title"],

              "updatedAt": datetime.now(
                  timezone(timedelta(hours=8))
              ).isoformat(timespec="seconds"),

              "items": items
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          PY

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes."
          else
            git commit -m "Update dashboard data"
            git push
          fi
